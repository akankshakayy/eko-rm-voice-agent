# Eko Sahayak behind the server's existing nginx (for the server admin; needs sudo).
#
#   1. DNS: sahayak.indev.eko.in -> 122.176.147.78
#   2. sudo cp nginx-sahayak.conf /etc/nginx/sites-available/sahayak
#      sudo ln -s /etc/nginx/sites-available/sahayak /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d sahayak.indev.eko.in     # free certificate; adds HTTPS + redirect
#
# Sahayak itself listens only on 127.0.0.1:8010, so nginx is the only way in from outside.
server {
    listen 80;
    server_name sahayak.indev.eko.in;

    client_max_body_size 100m;          # phones upload call recordings (the app's limit is 100 MB)

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;        # long uploads over slow mobile data
        proxy_send_timeout 300s;
    }
}
